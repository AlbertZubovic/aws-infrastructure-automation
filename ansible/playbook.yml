- hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Ensure Python 3 and pip
      ansible.builtin.dnf:
        name: [python3, python3-pip]
        state: present
        update_cache: true

    - name: Install Docker engine
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create venv and install Docker SDK
      ansible.builtin.pip:
        name: docker
        state: present
        virtualenv: /opt/ansible-venv
        virtualenv_command: /usr/bin/python3 -m venv

    - name: Use venv Python for subsequent tasks
      ansible.builtin.set_fact:
        ansible_python_interpreter: /opt/ansible-venv/bin/python

# DB host
- hosts: db
  become: true
  tasks:
    - name: Pull DB image
      community.docker.docker_image:
        name: "{{ db_image }}"
        source: pull

    - name: Create docker network
      community.docker.docker_network:
        name: posts_net
        state: present

    - name: Run DB container
      community.docker.docker_container:
        name: posts_db
        image: "{{ db_image }}"
        restart_policy: always
        networks: [{ name: posts_net }]
        env:
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: "{{ db_name }}"
        state: started

# Backend host
- hosts: backend
  become: true
  vars:
    db_ip: "{{ hostvars[inventory_hostname].db_private_ip | default(groups['db'][0]) }}"
  tasks:
    - name: Pull Backend image
      community.docker.docker_image:
        name: "{{ backend_image }}"
        source: pull

    - name: Create docker network
      community.docker.docker_network:
        name: posts_net
        state: present

    - name: Run Backend container
      community.docker.docker_container:
        name: posts_backend
        image: "{{ backend_image }}"
        restart_policy: always
        recreate: true
        networks: [{ name: posts_net }]
        env:
          DB_HOST: "{{ db_ip }}"
          DB_PORT: "{{ db_port | string }}"
          DB_USER: "{{ db_user }}"
          DB_PASSWORD: "{{ db_password }}"
          DB_NAME: "{{ db_name }}"
          PORT: "{{ backend_port | string }}"
        state: started

# Frontend host
- hosts: frontend
  become: true
  vars:
    be_ip: "{{ hostvars[inventory_hostname].backend_private_ip | default(groups['backend'][0]) }}"
  tasks:
    - name: Pull Frontend image
      community.docker.docker_image:
        name: "{{ frontend_image }}"
        source: pull

    - name: Create docker network
      community.docker.docker_network:
        name: posts_net
        state: present

    - name: Run Frontend container
      community.docker.docker_container:
        name: posts_frontend
        image: "{{ frontend_image }}"
        restart_policy: always
        recreate: true
        networks: [{ name: posts_net }]
        env:
          PORT: "{{ frontend_port | string }}"
          BACKEND_URL: "http://{{ be_ip }}:{{ backend_port }}"
        published_ports:
          - "{{ http_port }}:{{ frontend_port }}"
        state: started
