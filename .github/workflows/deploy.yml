name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KEY_NAME: a2-key3
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      # Configure AWS access
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Bootstrap Phase
      - name: Terraform init (bootstrap)
        working-directory: terraform/bootstrap
        run: terraform init -input=false

      # Try to import existing bucket/table
      - name: Import existing backend resources
        working-directory: terraform/bootstrap
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_state_bucket_name: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_state_table_name: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          terraform state show aws_s3_bucket.tf_state >/dev/null 2>&1 || \
            terraform import aws_s3_bucket.tf_state "${{ secrets.TF_STATE_BUCKET }}" || true

          terraform state show aws_s3_bucket_public_access_block.tf_state >/dev/null 2>&1 || \
            terraform import aws_s3_bucket_public_access_block.tf_state "${{ secrets.TF_STATE_BUCKET }}" || true

          terraform state show aws_s3_bucket_versioning.tf_state >/dev/null 2>&1 || \
            terraform import aws_s3_bucket_versioning.tf_state "${{ secrets.TF_STATE_BUCKET }}" || true

          terraform state show aws_s3_bucket_server_side_encryption_configuration.tf_state >/dev/null 2>&1 || \
            terraform import aws_s3_bucket_server_side_encryption_configuration.tf_state "${{ secrets.TF_STATE_BUCKET }}" || true

          terraform state show aws_dynamodb_table.tf_locks >/dev/null 2>&1 || \
            terraform import aws_dynamodb_table.tf_locks "${{ secrets.TF_LOCK_TABLE }}" || true

      - name: Terraform apply (bootstrap)
        working-directory: terraform/bootstrap
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "state_bucket_name=${{ secrets.TF_STATE_BUCKET }}" \
            -var "state_table_name=${{ secrets.TF_LOCK_TABLE }}"

      # Main Stack
      - name: Terraform init (main, remote)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply (main)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform apply -lock-timeout=5m -auto-approve -input=false \
            -var "key_name=${KEY_NAME}"

      # Capture outputs
      - name: Capture TF outputs
        id: tfout
        working-directory: terraform
        run: |
          echo "DB_PUB=$(terraform output -raw db_public_ip)" >> $GITHUB_OUTPUT
          echo "DB_PRIV=$(terraform output -raw db_private_ip)" >> $GITHUB_OUTPUT
          echo "BE_PUB=$(terraform output -raw backend_public_ip)" >> $GITHUB_OUTPUT
          echo "BE_PRIV=$(terraform output -raw backend_private_ip)" >> $GITHUB_OUTPUT
          echo "FE_PUB=$(terraform output -raw frontend_public_ip)" >> $GITHUB_OUTPUT
          echo "FE_PRIV=$(terraform output -raw frontend_private_ip)" >> $GITHUB_OUTPUT
          echo "FE_ALB=$(terraform output -raw frontend_alb_dns)" >> $GITHUB_OUTPUT
          echo "BE_ALB=$(terraform output -raw backend_alb_dns)" >> $GITHUB_OUTPUT

      # Ansible and deps
      - name: Install Ansible and deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible python3-pip jq
          ansible-galaxy collection install -r ansible/requirements.yml

      # Write SSH private key from secret
      - name: Write SSH key
        shell: bash
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$EC2_KEY" > ~/.ssh/${{ env.KEY_NAME }}.pem
          tr -d '\r' < ~/.ssh/${{ env.KEY_NAME }}.pem > ~/.ssh/${{ env.KEY_NAME }}.pem.clean && mv ~/.ssh/${{ env.KEY_NAME }}.pem.clean ~/.ssh/${{ env.KEY_NAME }}.pem
          chmod 600 ~/.ssh/${{ env.KEY_NAME }}.pem
          ssh-keygen -y -f ~/.ssh/${{ env.KEY_NAME }}.pem > /dev/null

      # Sanity check
      - name: Check AWS key pair exists
        shell: bash
        run: aws ec2 describe-key-pairs --key-names "${{ env.KEY_NAME }}" --query 'KeyPairs[0].KeyName' --output text

      # Generate inventory for all instances.
      - name: Generate inventory from EC2 tags
        shell: bash
        run: |
          set -euo pipefail
          FE_JSON=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=a2-frontend-ec2-*" "Name=instance-state-name,Values=running")
          BE_JSON=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=a2-backend-ec2-*"  "Name=instance-state-name,Values=running")
          DB_JSON=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=a2-db-ec2" "Name=instance-state-name,Values=running")

          jq_hosts () { jq -r '.Reservations[].Instances[] | select(.PublicIpAddress != null) | "\(.PrivateIpAddress) \(.PublicIpAddress)"'; }

          {
            echo "[db]"
            echo "$DB_JSON" | jq_hosts | awk '{printf "%s ansible_host=%s ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/%s.pem\n",$1,$2,"'${{ env.KEY_NAME }}'"}'

            echo
            echo "[backend]"
            DB_PRIV=$(terraform -chdir=terraform output -raw db_private_ip)
            echo "$BE_JSON" | jq_hosts | awk -v db="$DB_PRIV" '{printf "%s ansible_host=%s ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/%s.pem db_private_ip=%s\n",$1,$2,"'${{ env.KEY_NAME }}'",db}'

            echo
            echo "[frontend]"
            BE_ALB=$(terraform -chdir=terraform output -raw backend_alb_dns || true)
            if [ -z "$BE_ALB" ] || [ "$BE_ALB" = "null" ]; then
              BE_ALB=$(echo "$BE_JSON" | jq -r '.Reservations[].Instances[0].PrivateIpAddress')
            fi
            echo "$FE_JSON" | jq_hosts | awk -v be="$BE_ALB" '{printf "%s ansible_host=%s ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/%s.pem backend_private_ip=%s\n",$1,$2,"'${{ env.KEY_NAME }}'",be}'
          } > ansible/inventory.ini

          echo "inventory"
          cat ansible/inventory.ini

      # Trust host keys to avoid interactive prompt
      - name: Trust EC2 SSH host keys
        run: |
          touch ~/.ssh/known_hosts
          awk '/ansible_host=/{for(i=1;i<=NF;i++){if($i ~ /ansible_host=/){split($i,a,"="); print a[2]}}}' ansible/inventory.ini \
            | sort -u \
            | xargs -I{} sh -c 'ssh-keyscan -T 5 -H {} >> ~/.ssh/known_hosts 2>/dev/null || true'
          chmod 600 ~/.ssh/known_hosts

      # Run Ansible across all instances
      - name: Ansible - deploy containers
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_ARGS: "-o IdentitiesOnly=yes"
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml

      # Smoke test against the FE ALB
      - name: Smoke check
        run: |
          FE_ALB=${{ steps.tfout.outputs.FE_ALB }}
          for i in {1..15}; do
            if curl -sSfI --max-time 5 "http://$FE_ALB"; then
              exit 0
            fi
            echo "frontend not ready yet, retrying ($i/15)…"
            sleep 6
          done
          echo "frontend failed health check"
          exit 1

      # Upload inventory for debugging
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/inventory.ini
